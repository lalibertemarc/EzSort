<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3b2a63"/>
      <stop offset="0.55" stop-color="#1a1236"/>
      <stop offset="1" stop-color="#08061a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a0"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b3d"/>
      <stop offset="1" stop-color="#131725"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffd56a"/>
    </marker>
    <marker id="headDark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M-1,-1.5 L11.5,5 L-1,11.5 Z" fill="#1a0e04"/>
    </marker>
    <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d9d9d"/><stop offset="1" stop-color="#5a5a5a"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3ad"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1eff00"/><stop offset="1" stop-color="#0b7a00"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9bff"/><stop offset="1" stop-color="#0047a0"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c46bff"/><stop offset="1" stop-color="#6a1fa8"/></linearGradient><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a2e"/><stop offset="1" stop-color="#a84a00"/></linearGradient>
  </defs>

  <!-- Background and glow -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>

  <!-- Sort arrows cycling around the bag -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#1a0e04" stroke-width="20" marker-end="url(#headDark)">
      <path d="M51,286 A172,172 0 0 1 114,51"/>
      <path d="M349,114 A172,172 0 0 1 286,349"/>
    </g>
    <g stroke="#ffd56a" stroke-width="12" marker-end="url(#head)">
      <path d="M51,286 A172,172 0 0 1 114,51"/>
      <path d="M349,114 A172,172 0 0 1 286,349"/>
    </g>
  </g>

  <!-- Gold-framed inventory panel -->
  <rect x="84" y="84" width="232" height="232" rx="26" fill="url(#gold)" stroke="#1a0e04" stroke-width="6"/>
  <rect x="96" y="96" width="208" height="208" rx="16" fill="url(#panel)" stroke="#1a0e04" stroke-width="4"/>

  <!-- Slots: sorted by rarity, empties packed at the end -->
  <rect x="103" y="103" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#9d9d9d" stroke-width="4"/><rect x="171" y="103" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#ffffff" stroke-width="4"/><rect x="239" y="103" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#1eff00" stroke-width="4"/><rect x="103" y="171" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#3d9bff" stroke-width="4"/><rect x="171" y="171" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#c46bff" stroke-width="4"/><rect x="239" y="171" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#ff9a2e" stroke-width="4"/><rect x="103" y="239" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#3a4255" stroke-width="4" stroke-dasharray="7 6"/><rect x="171" y="239" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#3a4255" stroke-width="4" stroke-dasharray="7 6"/><rect x="239" y="239" width="58" height="58" rx="9" fill="#0b0f1a" stroke="#3a4255" stroke-width="4" stroke-dasharray="7 6"/>
  <path d="M115,125 L123,115 L141,115 L149,125 L132,150 Z" fill="url(#g0)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M115,125 L149,125 M123,115 L127,125 L132,150 M141,115 L137,125" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M123,117 L129,117 L126,123 Z" fill="#fff" fill-opacity="0.75"/><path d="M183,125 L191,115 L209,115 L217,125 L200,150 Z" fill="url(#g1)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M183,125 L217,125 M191,115 L195,125 L200,150 M209,115 L205,125" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M191,117 L197,117 L194,123 Z" fill="#fff" fill-opacity="0.75"/><path d="M251,125 L259,115 L277,115 L285,125 L268,150 Z" fill="url(#g2)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M251,125 L285,125 M259,115 L263,125 L268,150 M277,115 L273,125" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M259,117 L265,117 L262,123 Z" fill="#fff" fill-opacity="0.75"/><path d="M115,193 L123,183 L141,183 L149,193 L132,218 Z" fill="url(#g3)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M115,193 L149,193 M123,183 L127,193 L132,218 M141,183 L137,193" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M123,185 L129,185 L126,191 Z" fill="#fff" fill-opacity="0.75"/><path d="M183,193 L191,183 L209,183 L217,193 L200,218 Z" fill="url(#g4)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M183,193 L217,193 M191,183 L195,193 L200,218 M209,183 L205,193" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M191,185 L197,185 L194,191 Z" fill="#fff" fill-opacity="0.75"/><path d="M251,193 L259,183 L277,183 L285,193 L268,218 Z" fill="url(#g5)" stroke="#0a0606" stroke-width="3" stroke-linejoin="round"/><path d="M251,193 L285,193 M259,183 L263,193 L268,218 M277,183 L273,193" fill="none" stroke="#0a0606" stroke-opacity="0.45" stroke-width="2"/><path d="M259,185 L265,185 L262,191 Z" fill="#fff" fill-opacity="0.75"/>

  <!-- Sparkles -->
  <g fill="#fff6d0">
    <path d="M346,36 l5,15 15,5 -15,5 -5,15 -5,-15 -15,-5 15,-5z"/>
    <path d="M40,344 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4z"/>
    <path d="M366,318 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3z"/>
  </g>
</svg>
